name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      # Pinned to the current actions/checkout v4 tag target inspected during setup.
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      # Pinned to the current actions/setup-node v4 tag target inspected during setup.
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24

      - name: Check
        run: npm run check

      - name: Build
        run: npm run build

      - name: Package
        run: npm run package

      # Pinned to the current actions/upload-artifact v4 tag target inspected during setup.
      - name: Upload packages
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: chatto-enhancer-packages
          path: artifacts/*.zip
          if-no-files-found: error

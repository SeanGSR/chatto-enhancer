<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Chatto Enhancer</title>
<style>
  :root {
    color-scheme: dark;
    --background: #171717;
    --surface: #272727;
    --surface-strong: #444;
    --text: #eaeaef;
    --text-top: #f7f7f8;
    --muted: #92929d;
    --action: #2f9bf5;
  }
  * { box-sizing: border-box; }
  body {
    width: 304px;
    margin: 0;
    padding: 4px;
    background: var(--surface);
    color: var(--text);
    font: 13px -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, sans-serif;
  }
  .shell { display: flex; flex-direction: column; gap: 4px; }
  .section { border-radius: 6px; background: var(--background); }
  .header { display: flex; align-items: center; gap: 10px; padding: 10px; }
  .logo { width: 36px; height: 36px; border-radius: 9px; }
  .heading { display: flex; min-width: 0; flex-direction: column; gap: 2px; }
  h1 { margin: 0; color: var(--text-top); font-size: 14px; line-height: 1.2; }
  .subtitle, .hint, .status { color: var(--muted); font-size: 11px; line-height: 1.4; }
  .section-title {
    margin: 0;
    color: var(--muted);
    font-size: 10px;
    font-weight: 700;
    letter-spacing: .05em;
    text-transform: uppercase;
  }
  .site { padding: 9px 10px 10px; }
  #siteStatus { min-height: 15px; margin: 5px 0 0; }
  .features { padding: 4px; }
  .setting-row {
    display: flex;
    min-height: 48px;
    align-items: center;
    gap: 12px;
    padding: 7px 8px;
    border-radius: 6px;
    cursor: pointer;
  }
  .setting-row:hover { background: var(--surface); }
  .setting-copy { display: flex; min-width: 0; flex: 1; flex-direction: column; gap: 2px; }
  .setting-name { color: var(--text-top); font-weight: 600; }
  .setting-description { overflow: hidden; color: var(--muted); font-size: 11px; text-overflow: ellipsis; white-space: nowrap; }
  .setting-row input { position: absolute; width: 1px; height: 1px; opacity: 0; pointer-events: none; }
  .switch {
    position: relative;
    width: 34px;
    height: 20px;
    flex: 0 0 34px;
    border-radius: 999px;
    background: var(--surface-strong);
    transition: background-color .15s ease;
  }
  .switch::after {
    content: '';
    position: absolute;
    top: 3px;
    left: 3px;
    width: 14px;
    height: 14px;
    border-radius: 50%;
    background: var(--text);
    box-shadow: 0 1px 2px rgb(0 0 0 / .35);
    transition: transform .15s ease;
  }
  .setting-row input:checked + .switch { background: var(--action); }
  .setting-row input:checked + .switch::after { transform: translateX(14px); }
  .setting-row:has(input:focus-visible) { outline: 2px solid var(--action); outline-offset: -2px; }
  .data { padding: 9px 10px 10px; }
  .button-row { display: flex; gap: 8px; margin-top: 8px; }
  button {
    min-height: 32px;
    flex: 1;
    border: 0;
    border-radius: 6px;
    background: var(--surface);
    color: var(--text);
    font: 600 12px inherit;
    cursor: pointer;
  }
  button:hover { background: #343434; }
  button:focus-visible { outline: 2px solid var(--action); outline-offset: 1px; }
  #enableHereBtn { display: none; width: 100%; margin-top: 8px; }
  #enableHereBtn:disabled { cursor: default; opacity: .6; }
  #enableProgress {
    display: none;
    height: 3px;
    margin-top: 8px;
    overflow: hidden;
    border-radius: 999px;
    background: var(--surface-strong);
  }
  #enableProgress::after {
    content: '';
    display: block;
    width: 40%;
    height: 100%;
    border-radius: inherit;
    background: var(--action);
    animation: loading 1s ease-in-out infinite;
  }
  #dataStatus { min-height: 15px; margin: 6px 0 0; }
  .hint { margin: 0; }
  .footer { padding: 7px 10px; color: var(--muted); font-size: 10px; text-align: center; }
  @keyframes loading { from { transform: translateX(-100%); } to { transform: translateX(250%); } }
</style>
</head>
<body>
  <main class="shell">
    <header class="section header">
      <img class="logo" src="icons/icon-48.png" alt="">
      <div class="heading">
        <h1>Chatto Enhancer</h1>
        <span class="subtitle">Enhancements for Chatto 0.6</span>
      </div>
    </header>

    <section class="section site">
      <h2 class="section-title">This site</h2>
      <p id="siteStatus" class="status">Checking…</p>
      <button id="enableHereBtn" type="button">Enable here</button>
      <div id="enableProgress"></div>
    </section>

    <section id="toggles" class="section features" aria-label="Features"></section>

    <section class="section data">
      <h2 class="section-title">Data</h2>
      <div class="button-row">
        <button id="exportBtn" type="button">Export</button>
        <button id="importBtn" type="button">Import</button>
        <input id="importFile" type="file" accept="application/json" hidden>
      </div>
      <p id="dataStatus" class="status"></p>
      <p class="hint">Back up your Personal Library, profiles and GIF collections.</p>
    </section>

    <footer class="section footer">Also available from Chatto’s top bar</footer>
  </main>
  <script src="popup.js"></script>
</body>
</html>
